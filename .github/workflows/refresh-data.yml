name: Refresh Data Snapshots

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which refresh job to run"
        required: true
        default: "monthly-api"
        type: choice
        options:
          - due
          - monthly-api
          - ai-content-meta-review
          - all
  schedule:
    # Lightweight daily check; only sources whose persisted attempt is due run.
    # Stack Overflow/Cloudflare: 2nd. Wikipedia: 10th (after its monthly release).
    # Failed or not-yet-published sources are tried again two days later.
    - cron: "15 10 * * *"
    # Keep the weekly research sweep at Monday 09:30 UTC.
    - cron: "30 9 * * 1"

permissions:
  contents: write

concurrency:
  group: refresh-data-snapshots
  cancel-in-progress: false

jobs:
  refresh-snapshots:
    runs-on: ubuntu-latest
    # Leave time to save good snapshots even if every source hits its own timeout.
    timeout-minutes: 150
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh each due source independently
        id: refresh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_RESEARCH_MODEL: ${{ vars.OPENAI_RESEARCH_MODEL || 'gpt-5.4' }}
          RESEARCH_LOOKBACK_DAYS: ${{ vars.RESEARCH_LOOKBACK_DAYS || '7' }}
          REFRESH_TARGET: ${{ github.event.inputs.target || 'due' }}
          REFRESH_EVENT: ${{ github.event_name }}
        run: |
          if [[ "$REFRESH_EVENT" == "workflow_dispatch" && "$REFRESH_TARGET" != "due" ]]; then
            python scripts/refresh_sources.py --target "$REFRESH_TARGET" --force
          else
            python scripts/refresh_sources.py
          fi

      - name: Rebuild dashboard from successful snapshots
        if: steps.refresh.outputs.changed == 'true'
        run: |
          python scripts/build_dashboard_readable.py
          python scripts/embed_dashboard_readable.py

      - name: Save successful data and retry schedule
        if: steps.refresh.outputs.changed == 'true'
        run: |
          if git diff --quiet -- data index.html; then
            echo "No snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data index.html
          git commit -m "Refresh source snapshots and next attempts"
          # The independent traffic-log workflow can advance main during a refresh.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then exit 0; fi
          done
          exit 1

      - name: Report failed sources after saving healthy ones
        if: steps.refresh.outputs.failed == 'true'
        run: |
          echo "One or more sources failed. Good snapshots were saved; failed sources retry in two days."
          exit 1
